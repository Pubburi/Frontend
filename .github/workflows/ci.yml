name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check repository contents
        run: python3 scripts/check_repository.py
      - name: Install locked dependencies
        run: npm ci
      - name: Audit locked dependencies
        run: npm run audit:deps
      - name: Verify native image tooling
        run: npm run check:images
      - name: Typecheck React application
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        env:
          VITE_API_BASE_URL: /api
        run: npm run build
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test production build in Chromium
        run: npm run test:browser
      - name: Upload test reports and failure traces
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-test-reports
          path: |
            reports/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
